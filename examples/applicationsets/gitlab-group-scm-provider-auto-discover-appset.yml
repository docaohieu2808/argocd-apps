# Example (not synced): auto-discover Helm repos under a GitLab group on a self-hosted GitLab.
# `group` is required (a group path or numeric id); includeSubgroups walks nested groups.
# Needs a Secret `gitlab-token` (key `token`, read_api scope).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitlab-group-auto-discover
  namespace: argocd
  labels:
    provider: gitlab
    server: git.example.com
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    # SCM provider generator: auto-discovers all repos from self-hosted GitLab
    - scmProvider:
        gitlab:
          group: example-group
          api: https://git.example.com
          tokenRef:
            secretName: gitlab-token
            key: token
          allBranches: false
          includeSubgroups: true
        filters:
          - branchMatch: "^(main|master)$"
            pathsExist:
              - Chart.yaml
            labelMatch: "argocd-managed"

  template:
    metadata:
      name: "gitlab-{{.repository}}-{{.branch}}"
      namespace: argocd
      labels:
        provider: gitlab
        repo: "{{.repository}}"
    spec:
      project: default-project

      source:
        repoURL: "{{.url}}"
        targetRevision: "{{.branch}}"
        path: "."
        helm:
          releaseName: "{{.repository}}"
          valueFiles:
            - values.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: "gitlab-{{.repository}}"

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

  syncPolicy:
    preserveResourcesOnDeletion: false
