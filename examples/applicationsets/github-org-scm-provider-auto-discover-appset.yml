# Example (not synced): auto-discover Helm repos in a GitHub ORGANIZATION.
# The SCM provider generator calls the organization API, so it does not work for a personal account
# (docaohieu2808 is a user, hence the placeholder org below). Params: organization, repository, url, branch,
# sha, short_sha, labels, branchNormalized. Needs a Secret `argocd-github-token` (key `token`).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: github-docaohieu2808-auto-discover
  namespace: argocd
  labels:
    provider: github
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - scmProvider:
        github:
          organization: example-org
          tokenRef:
            secretName: argocd-github-token
            key: token
          allBranches: false
        filters:
          - repositoryMatch: ".*"
            branchMatch: "^(main|master)$"
            pathsExist:
              - Chart.yaml   # Helm apps only
            labelMatch: "argocd-managed"

  template:
    metadata:
      name: "github-{{.repository}}-{{.branch}}"
      namespace: argocd
      labels:
        provider: github
        repo: "{{.repository}}"
    spec:
      project: default-project

      source:
        repoURL: "{{.url}}"
        targetRevision: "{{.branch}}"
        path: "."
        helm:
          releaseName: "{{.repository}}"
          valueFiles:
            - values.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: "github-{{.repository}}"

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

  syncPolicy:
    preserveResourcesOnDeletion: false
