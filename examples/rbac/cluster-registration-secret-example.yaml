# Example (not synced): register a remote cluster so Argo CD can deploy to it.
#   1. On the TARGET cluster: create a ServiceAccount and bind the permissions Argo CD needs.
#        kubectl create serviceaccount argocd-manager -n kube-system
#        kubectl create clusterrolebinding argocd-manager --clusterrole=cluster-admin --serviceaccount=kube-system:argocd-manager
#        kubectl create token argocd-manager -n kube-system --duration=8760h
#   2. Fill in the values below (the token and CA are secrets: do not commit real ones).
#      Better: generate this Secret from External Secrets / Sealed Secrets, or use `argocd cluster add`.
#   3. kubectl apply -n argocd -f this-file
# The label argocd.argoproj.io/secret-type=cluster is what makes Argo CD pick the Secret up.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-example-staging
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    environment: staging
type: Opaque
stringData:
  name: example-staging
  server: https://k8s-staging.example.com:6443
  config: |
    {
      "bearerToken": "REPLACE_WITH_SERVICE_ACCOUNT_TOKEN",
      "tlsClientConfig": {
        "insecure": false,
        "caData": "REPLACE_WITH_BASE64_CA_CERTIFICATE"
      }
    }
