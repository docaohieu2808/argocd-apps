# ArgoCD Level 5 — Dex SSO OIDC config pointing to self-hosted GitLab
# Identity provider: git.example.com (GitLab)
# Prerequisites:
#   1. Create OAuth app in GitLab: git.example.com/-/profile/applications
#      - Redirect URI: https://<argocd-hostname>/api/dex/callback
#      - Scopes: read_user, openid, profile, email, read_api (for group membership)
#   2. Replace all {{PLACEHOLDER}} values before applying
#   3. Store client_secret in a Kubernetes Secret, not here (see note below)
# Apply: kubectl apply -f argocd-sso-dex-oidc-gitlab-config.yaml -n argocd
# Then restart: kubectl rollout restart deploy/argocd-server -n argocd
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  # Public URL of your ArgoCD instance
  url: https://{{ARGOCD_HOSTNAME}}

  # ── Dex configuration (embedded OIDC provider) ─────────────────────────────
  dex.config: |
    connectors:
      - type: oidc
        id: gitlab
        name: GitLab (docaohieu.com)
        config:
          # GitLab instance base URL
          issuer: https://git.example.com

          # OAuth2 application credentials from GitLab
          # Create at: https://git.example.com/-/profile/applications
          clientID: "{{GITLAB_OAUTH_CLIENT_ID}}"

          # SECURITY: prefer referencing a K8s Secret via env var injection
          # e.g., mount argocd-secret and set GITLAB_CLIENT_SECRET env var
          # then reference as: $GITLAB_CLIENT_SECRET
          clientSecret: "{{GITLAB_OAUTH_CLIENT_SECRET}}"

          # Dex callback — must match GitLab OAuth app redirect URI exactly
          redirectURI: https://{{ARGOCD_HOSTNAME}}/api/dex/callback

          # Request these scopes from GitLab
          scopes:
            - openid
            - profile
            - email
            - read_user
            - read_api      # Required for group membership lookup

          # Map GitLab groups into the "groups" claim so RBAC can use them
          # GitLab OIDC exposes groups in the token when read_api scope is granted
          claimMapping:
            groups: groups

          # Optional: restrict login to users in specific GitLab groups
          # Comment out to allow all authenticated GitLab users
          # groups:
          #   - devops-team
          #   - dev-team

          # GitLab returns groups as full paths (e.g., "myorg/devops-team")
          # Ensure RBAC group mappings in argocd-rbac-cm use the same format
          getUserInfo: true

    # Static passwords disabled — all auth via SSO
    # To keep a local admin break-glass account, manage via argocd-secret
    enablePasswordDB: false

  # Admin account disabled after SSO is confirmed working
  # Set to "false" only AFTER verifying SSO login works end-to-end
  admin.enabled: "true"

  # Repositories (add via UI or separate Secret manifests)
  # repositories: |
  #   - url: https://github.com/docaohieu2808/argocd-apps.git

  # ── OIDC config (alternative: use this instead of Dex for direct OIDC) ─────
  # Uncomment below block and remove dex.config if GitLab OIDC is used directly
  # (Dex is recommended for group-based RBAC on self-hosted GitLab)
  # oidc.config: |
  #   name: GitLab
  #   issuer: https://git.example.com
  #   clientID: {{GITLAB_OAUTH_CLIENT_ID}}
  #   clientSecret: {{GITLAB_OAUTH_CLIENT_SECRET}}
  #   requestedScopes:
  #     - openid
  #     - profile
  #     - email
  #     - read_user
