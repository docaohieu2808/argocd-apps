# ArgoCD Level 5 — External Cluster Registration Secret Template
# Registers a remote K8s cluster so ArgoCD can deploy to it (multi-cluster setup)
#
# INSTRUCTIONS:
#   1. Get target cluster kubeconfig credentials:
#      kubectl config view --raw --minify --flatten -o json > /tmp/cluster-creds.json
#   2. Extract values from kubeconfig or cluster API:
#      - server: cluster API endpoint (e.g. https://192.168.x.x:6443)
#      - caData: base64-encoded CA cert (certificate-authority-data)
#      - bearerToken: service account token with cluster-admin (see below)
#   3. Create a ServiceAccount + ClusterRoleBinding on the TARGET cluster:
#      kubectl create serviceaccount argocd-manager -n kube-system
#      kubectl create clusterrolebinding argocd-manager \
#        --clusterrole=cluster-admin \
#        --serviceaccount=kube-system:argocd-manager
#      # For K8s >= 1.24, create token manually:
#      kubectl create token argocd-manager -n kube-system --duration=0s
#   4. Replace ALL {{PLACEHOLDER}} values below
#   5. Apply ONLY on the ArgoCD control-plane cluster:
#      kubectl apply -f argocd-multi-cluster-external-secret-template.yaml -n argocd
#   6. Verify: argocd cluster list  (or ArgoCD UI → Settings → Clusters)
#
# NOTE: Label argocd.argoproj.io/secret-type=cluster is REQUIRED — ArgoCD
#       watches for this label to auto-register the cluster.
# NOTE: Never commit real tokens. Use Sealed Secrets or ESO to inject at runtime.
---
apiVersion: v1
kind: Secret
metadata:
  name: cluster-{{CLUSTER_NAME}}          # e.g. cluster-staging, cluster-prod-eu
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
    # REQUIRED: tells ArgoCD this Secret is a cluster registration
    argocd.argoproj.io/secret-type: cluster
  annotations:
    # Human-readable description shown in ArgoCD UI
    argocd.example.com/description: "{{CLUSTER_DESCRIPTION}}"
    # Environment tag (local | staging | production)
    argocd.example.com/environment: "{{CLUSTER_ENV}}"
    # Geographic region or datacenter label (optional)
    argocd.example.com/region: "{{CLUSTER_REGION}}"
type: Opaque
stringData:
  # Cluster API server endpoint (must be reachable from ArgoCD control plane)
  server: "https://{{CLUSTER_API_ENDPOINT}}"  # e.g. https://192.168.10.20:6443

  # JSON config blob — ArgoCD cluster config format
  config: |
    {
      "bearerToken": "{{ARGOCD_MANAGER_SA_TOKEN}}",
      "tlsClientConfig": {
        "insecure": false,
        "caData": "{{BASE64_ENCODED_CA_CERT}}"
      }
    }

  # Cluster name shown in ArgoCD UI and used in ApplicationSet generators
  name: "{{CLUSTER_NAME}}"
---
# ── ApplicationSet ClusterGenerator reference (informational) ─────────────────
# Once the cluster Secret is registered, target it in an ApplicationSet:
