# Argo CD RBAC for three roles (admin, developer, viewer). Managed by rbac-app with prune OFF.
# Groups come from the SSO provider; see examples/sso/ for the Dex + GitLab connector that emits them.
# Argo CD 3.x notes: `update` and `delete` on an application no longer cover its sub-resources, so
# developers get explicit `update/*` and `delete/*` (denied for delete); ApplicationSets have their own resource.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
data:
  policy.default: role:viewer

  policy.csv: |
    # role:admin
    p, role:admin, applications, *, */*, allow
    p, role:admin, applicationsets, *, */*, allow
    p, role:admin, clusters, *, *, allow
    p, role:admin, repositories, *, *, allow
    p, role:admin, projects, *, *, allow
    p, role:admin, accounts, *, *, allow
    p, role:admin, certificates, *, *, allow
    p, role:admin, gpgkeys, *, *, allow
    p, role:admin, logs, get, */*, allow
    p, role:admin, exec, create, */*, allow

    # role:developer: deploy and view, no delete, no cluster/repo admin
    p, role:developer, applications, get, */*, allow
    p, role:developer, applications, create, */*, allow
    p, role:developer, applications, update, */*, allow
    p, role:developer, applications, update/*, */*, allow
    p, role:developer, applications, sync, */*, allow
    p, role:developer, applications, override, */*, allow
    p, role:developer, applications, action/*, */*, allow
    p, role:developer, applications, delete, */*, deny
    p, role:developer, applications, delete/*, */*, deny
    p, role:developer, applicationsets, get, */*, allow
    p, role:developer, repositories, get, *, allow
    p, role:developer, projects, get, *, allow
    p, role:developer, logs, get, */*, allow
    p, role:developer, exec, create, */*, deny

    # role:viewer: read-only
    p, role:viewer, applications, get, */*, allow
    p, role:viewer, applicationsets, get, */*, allow
    p, role:viewer, repositories, get, *, allow
    p, role:viewer, clusters, get, *, allow
    p, role:viewer, projects, get, *, allow
    p, role:viewer, logs, get, */*, allow

    # Group -> role. GitLab emits full group paths ("myorg/devops-team"), so use the same form here.
    g, devops-team, role:admin
    g, platform-team, role:admin
    g, backend-team, role:developer
    g, frontend-team, role:developer
    g, dev-team, role:developer
    g, qa-team, role:viewer
    g, management, role:viewer

  # Token claims used to match groups
  scopes: "[groups, email]"
