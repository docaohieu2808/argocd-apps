# Matrix generator: every app in the first list is deployed once per environment in the second list.
# Today the app list holds one entry, the public argocd-test-deploy repo, whose k8s/overlays/<environment> are
# Kustomize overlays (1 replica in staging, 2 in production), so this renders two real Applications:
# test-deploy-staging and test-deploy-production. Add more elements to the first list to fan out more apps.
# (Per-environment values come from overlays in Git, not from Application-level kustomize.replicas: two apps
# sharing one repo path and different kustomize options rendered the same replicas in testing.)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: matrix-test-deploy
  namespace: argocd
  labels:
    pattern: matrix-generator
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - repoURL: https://github.com/docaohieu2808/argocd-test-deploy.git
                  appName: test-deploy
                  overlaysPath: k8s/overlays
          - list:
              elements:
                - environment: staging
                - environment: production
  template:
    metadata:
      name: "{{.appName}}-{{.environment}}"
      namespace: argocd
      labels:
        environment: "{{.environment}}"
        app: "{{.appName}}"
    spec:
      project: default-project
      source:
        repoURL: "{{.repoURL}}"
        targetRevision: HEAD
        path: "{{.overlaysPath}}/{{.environment}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.appName}}-{{.environment}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
  syncPolicy:
    preserveResourcesOnDeletion: false
