spec:
  project: default-project
  source:
    repoURL: https://github.com/docaohieu2808/argocd-apps.git
    targetRevision: HEAD
    path: applicationsets
  destination:
    server: https://rancher.example.com/k8s/clusters/local
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - Validate=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
