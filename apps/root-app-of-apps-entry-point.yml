apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: app-of-apps
spec:
  project: default-project

  source:
    repoURL: https://github.com/docaohieu2808/argocd-apps.git
    targetRevision: HEAD
    # Sync the apps/ directory itself so ArgoCD manages all child Application
    # manifests declared here (projects-app, rbac-app, applicationsets-app).
    path: apps

  destination:
    server: https://rancher.example.com/k8s/clusters/local
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
---
# Child app: manages applicationsets/ directory
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: applicationsets-app
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
