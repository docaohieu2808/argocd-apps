# AppProject used by every Application and ApplicationSet in this repo (except root-app/projects-app,
# which live in the built-in `default` project because they create this one).
# A sync-window example (business hours for production) is in examples/projects/: windows block automated
# syncs outside the window, which would make a fresh install look broken, so none is active here.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default-project
  namespace: argocd
spec:
  description: "Apps from the docaohieu2808 GitHub account and the example GitLab, staging and production"

  sourceRepos:
    - "https://github.com/docaohieu2808/*"
    - "https://git.example.com/*"
    # Maintained Helm repositories (charts.helm.sh/stable is archived; Bitnami moved to OCI/Broadcom)
    - "https://argoproj.github.io/argo-helm"
    - "https://traefik.github.io/charts"

  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRole
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
    - group: "networking.k8s.io"
      kind: IngressClass
    - group: "apiextensions.k8s.io"
      kind: CustomResourceDefinition

  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange

  orphanedResources:
    warn: true

  roles:
    - name: staging-deployer
      description: "Can sync staging applications"
      policies:
        - "p, proj:default-project:staging-deployer, applications, get, default-project/*, allow"
        - "p, proj:default-project:staging-deployer, applications, sync, default-project/*-staging, allow"
        - "p, proj:default-project:staging-deployer, applications, override, default-project/*-staging, allow"
      groups:
        - staging-team

    - name: production-deployer
      description: "Can sync production applications"
      policies:
        - "p, proj:default-project:production-deployer, applications, get, default-project/*, allow"
        - "p, proj:default-project:production-deployer, applications, sync, default-project/*-production, allow"
        - "p, proj:default-project:production-deployer, applications, override, default-project/*-production, allow"
      groups:
        - production-team

    - name: read-only
      description: "Read-only access to all applications"
      policies:
        - "p, proj:default-project:read-only, applications, get, default-project/*, allow"
      groups:
        - developers
